# Deploy: after CI passes on main, build both images, push them to GitHub Container Registry
# and roll the two Azure container apps onto them. Azure login is OIDC (no stored password);
# the identity and the repository variables are set up as described in deploy/README.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false # never stop a rollout halfway

env:
  REGISTRY: ghcr.io/baraalomari
  RESOURCE_GROUP: marketlens-rg
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Image (${{ matrix.app }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            context: backend
          - app: web
            context: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/marketlens-${{ matrix.app }}:${{ env.SHA }}
            ${{ env.REGISTRY }}/marketlens-${{ matrix.app }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Roll out to Azure
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update the API, then the UI
        run: |
          for app in api web; do
            az containerapp update -g "$RESOURCE_GROUP" -n "marketlens-$app" \
              --image "$REGISTRY/marketlens-$app:$SHA" --only-show-errors -o none
          done
      - name: Smoke test
        run: |
          url="https://$(az containerapp show -g "$RESOURCE_GROUP" -n marketlens-web \
            --query properties.configuration.ingress.fqdn -o tsv)"
          # Both apps may be starting from zero, so allow a cold start.
          for i in $(seq 1 12); do
            if curl -fsS --max-time 30 "$url/api/health" | grep -q '"ok":true'; then
              echo "Healthy: $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url/api/health did not report a working database"
          exit 1
